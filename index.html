<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carma Medical Wellness</title>
<link rel="icon" type="image/png" href="logo-carma.png">
<style>
:root{--bg:#f3f7f6;--surface:var(--sf,#fff);--text:var(--tx,#12302b);--muted:var(--mu,#5d7872);--line:var(--ln,#dbe6e3);--brand:var(--ac,#0f766e);--brand-soft:color-mix(in srgb,var(--ac,#0f766e) 14%,var(--sf,#fff));--c1:var(--ac,#0f766e);--c2:var(--ac2,#c2410c);--c3:#1d4ed8;--c4:#7e22ce;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a18;--surface:var(--sf,#152724);--text:var(--tx,#e6f2ef);--muted:var(--mu,#92b0aa);--line:var(--ln,#24403b);--brand:var(--ac,#2dd4bf);--brand-soft:color-mix(in srgb,var(--ac,#2dd4bf) 14%,var(--sf,#152724));--c1:var(--ac,#2dd4bf);--c2:var(--ac2,#fb923c);--c3:#60a5fa;--c4:#c084fc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a18;--surface:var(--sf,#152724);--text:var(--tx,#e6f2ef);--muted:var(--mu,#92b0aa);--line:var(--ln,#24403b);--brand:var(--ac,#2dd4bf);--brand-soft:color-mix(in srgb,var(--ac,#2dd4bf) 14%,var(--sf,#152724));--c1:var(--ac,#2dd4bf);--c2:var(--ac2,#fb923c);--c3:#60a5fa;--c4:#c084fc;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.preview{display:flex;gap:6px;justify-content:center;padding:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.preview button{border:1px solid var(--line);background:none;color:var(--muted);padding:6px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.preview button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.stage{display:flex;justify-content:center;padding:0}
.app{width:100%;background:var(--bg);min-height:calc(100vh - 54px);position:relative;display:flex;flex-direction:column}
.stage.mobile .app{max-width:400px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.stage.tablet .app{max-width:1024px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:12px;background:#fff;border:1px solid var(--line);color:#fff;display:grid;place-items:center;overflow:hidden;flex:none;padding:3px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
header h1{font-size:18px;margin:0;line-height:1.2}
header small{color:var(--muted);font-size:13px}
.layout{display:flex;flex:1;min-height:0}
nav.side{display:none}
main{flex:1;padding:20px;padding-bottom:90px}
h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;color:inherit;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--brand)}
.card .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--col);background:color-mix(in srgb,var(--col) 14%,transparent)}
.card .ic svg,.tab svg,.side button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .stat{margin-top:auto;font-size:13px;color:var(--col);font-weight:600}
.panel{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
.back{background:none;border:none;color:var(--brand);font:inherit;cursor:pointer;padding:0 0 12px}
.tabbar{position:sticky;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);font:inherit;font-size:11px;padding:6px 2px;cursor:pointer}
.tab[aria-current="true"]{color:var(--brand);font-weight:600}
.stage.tablet nav.side{display:flex;flex-direction:column;gap:4px;width:220px;padding:16px 12px;background:var(--surface);border-right:1px solid var(--line)}
.stage.tablet .side button{display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--muted);font:inherit;padding:12px 14px;border-radius:12px;cursor:pointer;text-align:left}
.stage.tablet .side button[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.stage.tablet .tabbar{display:none}
.stage.tablet main{padding:28px;padding-bottom:28px}
.stage.tablet .grid{grid-template-columns:1fr 1fr}
.stage.tablet .card{min-height:170px}
.uh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.uact{display:flex;gap:8px;flex-shrink:0}
.ab{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer;width:42px;height:42px;border-radius:50%;padding:0}
.ab .i{font-size:26px;line-height:1;font-weight:400}.ab .t{display:none}
.ab.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.ab.danger{background:#dc2626;border-color:#dc2626;color:#fff}
.stage.tablet .ab{width:auto;height:auto;border-radius:12px;padding:10px 18px}
.stage.tablet .ab .i{display:none}.stage.tablet .ab .t{display:inline}
.search{width:100%;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit}
.dbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--brand-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.dbar div{display:flex;gap:8px}
.dbar button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.dbar .danger{background:#dc2626;border-color:#dc2626;color:#fff}
.dbar button:disabled{opacity:.5;cursor:default}
.urow{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.urow.sel{border-color:#dc2626}
.urow input[type=checkbox]{width:20px;height:20px;margin-top:10px;flex-shrink:0;accent-color:#dc2626}
.av{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.cells{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.cells b{color:var(--text);font-size:16px}
.cells span{overflow:hidden;text-overflow:ellipsis}
.uhead{display:none}
.stage.tablet .uhead{display:grid;padding:0 14px 8px 68px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stage.tablet .cells{display:grid;grid-template-columns:1.3fr .8fr 1.5fr 1fr 1.7fr 1fr;gap:12px;align-items:center}
.stage.tablet .uhead{grid-template-columns:1.3fr .8fr 1.5fr 1fr 1.7fr 1fr;gap:12px}
.stage.tablet .urow{align-items:center}
.stage.tablet .urow input[type=checkbox]{margin-top:0}
.stage.tablet .cells{font-size:13px}.stage.tablet .cells b{font-size:15px}
.stage.tablet .app,.stage.tablet .app{max-width:1024px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);color:var(--text);border-radius:18px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mbox h3{margin:0 0 4px}.mbox label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.mbox input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.mrow button{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.mrow .pri{background:var(--brand);border-color:var(--brand);color:#fff}.mrow .danger{background:#dc2626;border-color:#dc2626;color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.idbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.idrow{display:flex;gap:10px;flex-wrap:wrap}
.drop{flex:1;min-width:130px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.drop input{font-size:12px;padding:6px;max-width:100%}
.drop img{display:none;width:100%;max-height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.idbox button{padding:10px 14px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;cursor:pointer}
.idbox .idrow button{background:var(--surface);color:var(--text);border-color:var(--line)}
.idbox button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted)}
.dc{font-style:normal;font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}.det dt{color:var(--muted)}.det dd{margin:0;word-break:break-word}
.btns{display:flex;gap:6px}
.pb{flex:1;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer}
.pb.cam{background:var(--brand);border-color:var(--brand);color:#fff}
.idbox pre{white-space:pre-wrap;font-size:11px;max-height:160px;overflow:auto;margin:6px 0 0;color:var(--muted)}
.idbox summary{font-size:12px;color:var(--muted);cursor:pointer}
.stage.tablet .cells.two{grid-template-columns:1fr 2fr}
.trend{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.trend h3{margin:0 0 10px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.sel{border-width:2px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.chart{width:100%;height:auto;display:block}
.chart line{stroke:var(--line);stroke-width:1}.chart text{font-size:11px;fill:var(--muted)}
.chart polyline{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.leg{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:14px}
.mbox.wide{max-width:560px}
.exr{display:grid;grid-template-columns:auto 1.7fr .7fr .7fr .8fr auto;gap:6px;align-items:center}
.lkb{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;width:34px;height:36px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;padding:0}
.lkb:disabled{opacity:.35;cursor:default}
.exr.lk .lkb{background:var(--brand);border-color:var(--brand);color:#fff}
.exr.grp{border-left:3px solid var(--brand);padding-left:6px;margin-left:-9px}
.exr input{padding:8px;min-width:0}
.xr{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;width:32px;height:36px;font-size:18px;cursor:pointer}
.addx{align-self:flex-start;border:1px dashed var(--brand);background:none;color:var(--brand);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.stab{width:100%;border-collapse:collapse;font-size:14px}.stab th,.stab td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}.stab th{color:var(--muted);font-weight:600;font-size:12px}
/* calendario */
.seg{display:flex;background:var(--brand-soft);border-radius:12px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{flex:1;border:none;background:none;color:var(--muted);font:inherit;font-size:14px;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.cnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cn{border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:20px;line-height:1;width:44px;height:38px;border-radius:10px;cursor:pointer;padding:0}
.cn.tdy{font-size:14px;font-weight:600;width:auto;padding:0 18px;color:var(--brand)}
.wstrip{display:flex;margin-bottom:8px}
.ws{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;padding:2px 0}
.ws b{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;font-size:16px;font-weight:500;color:var(--text)}
.ws.today b{color:var(--brand);font-weight:700}
.ws.sel b{background:var(--brand);color:#fff}
.tl{--hh:56px;position:relative;height:calc(100vh - 410px);min-height:380px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage.tablet .tl{height:calc(100vh - 350px)}
.tlh{position:sticky;top:0;z-index:6;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.tlh .gut{height:auto}
.dh{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;border-left:1px solid var(--line);color:var(--muted);font:inherit;font-size:11px;padding:4px 0;cursor:pointer;min-width:0}
.dh b{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;font-size:15px;font-weight:500;color:var(--text)}
.dh.today b{background:var(--brand);color:#fff;font-weight:700}
.tlb{display:flex;position:relative}
.gut{width:46px;flex-shrink:0;position:relative}
.gut span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.col{flex:1;min-width:0;position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh)}
.col.today{background-color:color-mix(in srgb,var(--brand) 5%,transparent)}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid #e11d48;z-index:4;pointer-events:none}
.now i{position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:#e11d48}
.ev{position:absolute;z-index:2;cursor:pointer;-webkit-touch-callout:none}
.evb{height:100%;overflow:hidden;border-radius:7px;border-left:4px solid var(--col);background:color-mix(in srgb,var(--col) 20%,var(--surface));padding:3px 6px;color:var(--text)}
.ev.acc .evb{background:color-mix(in srgb,var(--col) 10%,var(--surface));border-left-style:dotted}
.evb b{display:block;font-size:12px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evb span{display:block;font-size:11px;line-height:1.25;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.md .evu{display:none}
.ev.sm .evb{padding:1px 6px}.ev.sm .evb span{display:none}.ev.sm .evb b{font-size:11px}
.week .evb{padding:2px 3px 2px 4px;border-left-width:3px}
.stage.mobile .week .evb span{display:none}
.stage.mobile .week .evb b{font-size:10px;white-space:normal;word-break:break-word}
.rh{position:absolute;left:0;right:0;bottom:-5px;height:16px;cursor:ns-resize;touch-action:none}
.rh::after{content:"";position:absolute;left:50%;bottom:7px;width:22px;height:3px;border-radius:2px;background:var(--col);opacity:.8;transform:translateX(-50%)}
.ev.drag{z-index:30}
.ev.drag .evb{box-shadow:0 8px 22px rgba(0,0,0,.35)}
.ev.drag::after{content:attr(data-t);position:absolute;left:0;top:-26px;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;white-space:nowrap;pointer-events:none}
.chint{margin:8px 2px 0}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.mw{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px}
.mday{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;color:var(--text);cursor:pointer;overflow:hidden;min-width:0}
.mday.out{opacity:.4}
.mday .n{font-size:14px;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}
.mday.today .n{background:var(--brand);color:#fff;font-weight:700}
.mday.sel{box-shadow:0 0 0 2px var(--brand)}
.mdots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.mdots i{width:6px;height:6px;border-radius:50%;background:var(--col)}
.mchip{display:none}
.stage.tablet .mday{min-height:104px;align-items:stretch;padding:4px;gap:2px}
.stage.tablet .mday .n{align-self:flex-start}
.stage.tablet .mdots{display:none}
.stage.tablet .mchip{display:block;font-size:11px;line-height:1.3;padding:1px 5px;border-radius:5px;border-left:3px solid var(--col);background:color-mix(in srgb,var(--col) 20%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.mday small{font-size:10px;color:var(--muted)}
.stage.tablet .mday small{text-align:left}
.dlh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:16px 0 8px}
.dlh h3{margin:0;font-size:17px}
.dlh div{display:flex;gap:6px}
.dlh .pb{flex:none;padding:8px 12px}
.cbar{width:4px;align-self:stretch;border-radius:2px;background:var(--col);flex-shrink:0}
.ygrid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stage.tablet .ygrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.ymon{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.ym{background:none;border:none;font:inherit;font-weight:700;color:var(--brand);padding:0 0 6px;cursor:pointer;text-transform:capitalize}
.yg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:11px}
.yg b{color:var(--muted);font-weight:500}
.yd{border:none;background:none;color:var(--text);font:inherit;font-size:11px;padding:0;border-radius:50%;cursor:pointer;aspect-ratio:1;min-width:0}
.yd.has{background:color-mix(in srgb,var(--brand) 24%,transparent);font-weight:600}
.yd.today{background:var(--brand);color:#fff;font-weight:700}
.mbox select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.frow{display:flex;gap:8px}.frow label{flex:1;min-width:0}
.crow{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.mbox label.cc{flex-direction:row;cursor:pointer}
.cc input{display:none}
.cc i{display:block;width:32px;height:32px;border-radius:50%;background:var(--col);border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.cc input:checked+i{border-color:var(--text)}
.cul{flex-shrink:0;min-height:120px;max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.mbox label.cur{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--text);padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.cur:last-child{border-bottom:none}
.cul input[type=checkbox]{width:20px;height:20px;padding:0;flex-shrink:0;accent-color:var(--brand)}
.av.sm{width:30px;height:30px;font-size:12px}
.cun{display:flex;flex-direction:column;min-width:0}
.cun small{font-size:12px;color:#c2410c}
/* menu utente, ingressi, pacchetti, avvisi */
.umenu{display:flex;flex-direction:column;gap:8px}
.umenu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-weight:600;cursor:pointer}

.det dd{white-space:pre-wrap}

function drawChart(ser){
  var W=600,H=260,L=44,R=16,T=14,B=30,all=[],ts=[];
  ser.forEach(function(s){s.pts.forEach(function(p){all.push(p.v);ts.push(p.t)})});
  if(!all.length)return '<div class="status">Nessun carico registrato per questi esercizi.</div>';
  var vmin=Math.min.apply(null,all),vmax=Math.max.apply(null,all),pad=(vmax-vmin)||vmax||1;
  vmin=Math.max(0,vmin-pad*.15);vmax=vmax+pad*.15;
  var tmin=Math.min.apply(null,ts),tmax=Math.max.apply(null,ts),dt=(tmax-tmin)||1;
  function X(t){return tmax===tmin?L+(W-L-R)/2:L+(t-tmin)/dt*(W-L-R)}
  function Y(v){return T+(1-(v-vmin)/(vmax-vmin))*(H-T-B)}
  var g='',i;
  for(i=0;i<=4;i++){var v=vmin+(vmax-vmin)*i/4,y=Y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fnum(Math.round(v*10)/10)+'</text>'}
  var dates=[];ser.forEach(function(s){s.pts.forEach(function(p){if(dates.indexOf(p.d)<0)dates.push(p.d)})});dates.sort();
  var pick=dates.length<=5?dates:[0,1,2,3,4].map(function(j){return dates[Math.round(j*(dates.length-1)/4)]});
  pick.forEach(function(d){g+='<text x="'+X(Date.parse(d))+'" y="'+(H-8)+'" text-anchor="middle">'+sdate(d)+'</text>'});
  ser.forEach(function(s){
    if(s.pts.length>1)g+='<polyline style="stroke:'+s.color+'" points="'+s.pts.map(function(p){return X(p.t)+','+Y(p.v)}).join(' ')+'"/>';
    s.pts.forEach(function(p){g+='<circle cx="'+X(p.t)+'" cy="'+Y(p.v)+'" r="4.5" style="fill:'+s.color+'"><title>'+esc(s.name)+' · '+fdate(p.d)+' · '+fnum(p.v)+' kg</title></circle>'});
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Andamento del carico in kg nel tempo">'+g+'</svg>';
}

// Più utenti possono essere assegnati alla stessa fascia, e più voci possono sovrapporsi.

var HH=56, SNAP=15, CCOL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','#dc2626','#db2777','#c026d3','#4f46e5','#0284c7','#0891b2','#059669','#16a34a','#65a30d','#ca8a04','#d97706','#ea580c','#92400e','#475569','#f43f5e','#14b8a6','#8b5cf6','#3b82f6','#78716c','#4d7c0f'].slice(0,20);

function pad(n){return ('0'+n).slice(-2)}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseIso(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function mondayOf(d){return addDays(d,-((d.getDay()+6)%7))}
function hm(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function tmin(s){var p=String(s||'').split(':');return p.length<2||isNaN(+p[0])||isNaN(+p[1])?null:+p[0]*60+ +p[1]}
function dayLong(d){return GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()]+' '+d.getFullYear()}
function dayShort(s){var d=parseIso(s);return GIORNI3[d.getDay()]+' '+d.getDate()+' '+MESI3[d.getMonth()]}

  a(0,'lezione','Yoga','09:00','10:00',0,['1','2']);
  a(0,'accesso','Accesso libero','10:00','12:00',0,['3']);
  a(1,'accesso','Accesso libero','17:00','20:00',0,['1','3']);

function nowY(){var n=new Date();return (n.getHours()*60+n.getMinutes())/60*HH}
// colonne affiancate per le voci che si sovrappongono (come nel calendario Apple)
function layoutDay(L){
  L=L.slice().sort(function(a,b){return a.s-b.s||b.e-a.e});
  var res={},cl=[],cend=-1;
  function flush(){
    var ends=[];
    cl.forEach(function(it){var c=0;while(ends[c]!==undefined&&ends[c]>it.s)c++;ends[c]=it.e;res[it.id]={c:c}});
    cl.forEach(function(it){res[it.id].n=ends.length});cl=[];
  }
  L.forEach(function(it){if(cl.length&&it.s>=cend){flush();cend=-1}cl.push(it);cend=Math.max(cend,it.e)});
  if(cl.length)flush();
  return res;
}
function evHtml(it,lay){

// ---- spostamento e ridimensionamento col dito o col mouse ----
function dragOn(d){
  d.active=true;d.el.classList.add('drag');calApply(d);
  d.raf=requestAnimationFrame(calAuto);
  if(d.touch&&navigator.vibrate){try{navigator.vibrate(12)}catch(_){}}
}
function calApply(d){
  var br=d.body.getBoundingClientRect(),dur=d.e0-d.s0,y=d.cy-br.top;
  if(d.mode==='resize'){
    var m=Math.round(y/HH*60/SNAP)*SNAP;m=Math.max(d.s0+SNAP,Math.min(1440,m));
    d.s=d.s0;d.e=m;d.el.style.height=Math.max(18,(d.e-d.s)/60*HH-1)+'px';
  }else{
    var m2=Math.round((y-d.grab)/HH*60/SNAP)*SNAP;m2=Math.max(0,Math.min(1440-dur,m2));
    d.s=m2;d.e=m2+dur;d.el.style.top=(d.s/60*HH)+'px';
    if(d.cols.length>1){
      var best=0,bd=1e9;
      d.cols.forEach(function(c,i){var r=c.getBoundingClientRect(),dd=Math.abs(d.cx-(r.left+r.right)/2);if(dd<bd){bd=dd;best=i}});
      d.day=d.cols[best].getAttribute('data-day');
      d.el.style.transform='translateX('+(d.cols[best].getBoundingClientRect().left-d.colLeft)+'px)';
    }
  }
  var tt=d.el.querySelector('.evt');if(tt)tt.textContent=hm(d.s)+'–'+hm(d.e);
  d.el.setAttribute('data-t',(d.cols.length>1?dayShort(d.day)+' · ':'')+hm(d.s)+'–'+hm(d.e));
}
function calAuto(){
  var d=cdrag;if(!d||!d.active)return;
  var sc=document.getElementById('tl');
  if(sc){var r=sc.getBoundingClientRect(),top=r.top+(d.cols.length>1?84:48),v=d.cy<top?-10:d.cy>r.bottom-48?10:0;if(v){sc.scrollTop+=v;calApply(d)}}
  d.raf=requestAnimationFrame(calAuto);
}
function endDrag(e,ok){
  var d=cdrag;if(!d||e.pointerId!==d.pid)return;
  clearTimeout(d.tm);cancelAnimationFrame(d.raf);cdrag=null;
  if(!d.active)return;
  d.el.classList.remove('drag');
  var changed=d.s!==d.s0||d.e!==d.e0||d.day!==d.day0;
  if(ok&&changed){calNoClick=Date.now();saveC(d.it,{day:d.day,s:d.s,e:d.e});autoIng()}
  drawCal();
}
document.addEventListener('pointerdown',function(e){
  var ev=e.target.closest&&e.target.closest('.ev');if(!ev||cdrag)return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  var it=findC(ev.getAttribute('data-ci'));if(!it)return;
  var body=ev.closest('.tlb'),col=ev.parentNode;
  var d=cdrag={el:ev,it:it,mode:e.target.closest('.rh')?'resize':'move',pid:e.pointerId,x0:e.clientX,y0:e.clientY,cx:e.clientX,cy:e.clientY,active:false,touch:e.pointerType!=='mouse',
    s0:it.s,e0:it.e,day0:it.day,s:it.s,e:it.e,day:it.day,body:body,cols:[].slice.call(body.querySelectorAll('.col')),colLeft:col.getBoundingClientRect().left,grab:e.clientY-ev.getBoundingClientRect().top};
  try{ev.setPointerCapture(e.pointerId)}catch(_){}
  // col dito: serve un tocco prolungato per afferrare la voce, così lo scorrimento della pagina resta libero
  if(d.touch&&d.mode==='move')d.tm=setTimeout(function(){if(cdrag===d)dragOn(d)},380);
});
document.addEventListener('pointermove',function(e){
  var d=cdrag;if(!d||e.pointerId!==d.pid)return;
  d.cx=e.clientX;d.cy=e.clientY;
  if(!d.active){
    if(Math.abs(e.clientX-d.x0)+Math.abs(e.clientY-d.y0)<(d.touch?10:4))return;
    if(d.touch&&d.mode==='move'){clearTimeout(d.tm);cdrag=null;return}
    dragOn(d);
  }
  calApply(d);
});
document.addEventListener('pointerup',function(e){endDrag(e,true)});
document.addEventListener('pointercancel',function(e){endDrag(e,false)});
document.addEventListener('touchmove',function(e){if(cdrag&&cdrag.active&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',function(e){if(e.target.closest&&e.target.closest('.ev'))e.preventDefault()});

  }

});

var dbExpected=!!(window.claude&&window.claude.use), dbFail=false;   /* con un database collegato, i dati veri arrivano dopo: fino ad allora non si mostrano avvisi (prima comparivano quelli dei pacchetti di prova) */

  function a(u,off,e,o,p){ING.push({id:'i'+(++iid),uid:u,day:iso(addDays(t,-off)),ent:e,usc:o,note:'',pid:p})}
  [[2,'17:30','18:45'],[5,'09:00','10:15'],[9,'18:00','19:30'],[12,'17:45','19:00'],[20,'09:15','10:30']].forEach(function(x){a('1',x[0],x[1],x[2],'p1')});

})();
function pk_key(p){return p.data+'|'+('0000000000000'+(p.ts||0)).slice(-13)}
function findP(id){return PAC.filter(function(x){return String(x.id)===String(id)})[0]}
function pacOf(u){return PAC.filter(function(p){return (p.uids||[]).indexOf(String(u))>-1}).sort(function(a,b){return pk_key(a).localeCompare(pk_key(b))})}
function usedOf(p){return ING.filter(function(x){return String(x.pid)===String(p.id)}).length}
function restOf(p){return Math.max(0,p.tot-usedOf(p))}
function restUser(u){return pacOf(u).reduce(function(s,p){return s+restOf(p)},0)}
function autoPid(u){var p=pacOf(u).filter(function(p){return restOf(p)>0})[0];return p?String(p.id):''}
function uname(u){return u.n+' '+u.c}
// pacchetti con al massimo SOGLIA lezioni rimaste, se qualcuno di chi li usa non ne ha già uno più recente
function alertsReady(){return !dbExpected||dbFail||!!(rdy.pac&&rdy.ing&&rdy.u)}
function alerts(){
  var out=[];if(!alertsReady())return out;
  PAC.forEach(function(p){
    var r=restOf(p);if(r>SOGLIA)return;
    var us=(p.uids||[]).map(function(i){return find(i)}).filter(Boolean);if(!us.length)return;
    var attivi=us.filter(function(u){return !u.nr&&!pacOf(u.id).some(function(q){return q!==p&&pk_key(q)>pk_key(p)})});
    if(attivi.length)out.push({p:p,r:r,us:us,at:attivi});
  });
  return out.sort(function(a,b){return a.r-b.r});
}
function alertsHtml(){
  var A=alerts().filter(function(a){return a.p.okR!==a.r});if(!A.length)return '';
  return '<div class="alh">Ingressi in esaurimento</div><div class="alerts">'+A.map(function(a){
    var msg=a.r===0?'pacchetto esaurito':'restano '+a.r+(a.r===1?' ingresso':' ingressi');
    return '<div class="alert'+(a.r===0?' out':'')+'"><button class="alb" data-alu="'+esc(a.at[0].id)+'"><i>!</i><span><b>'+esc(a.at.map(uname).join(', '))+'</b><small>'+msg+' · pacchetto da '+a.p.tot+(a.us.length>1?' condiviso':'')+'</small></span></button><button class="ok" data-act="al_ok" data-id="'+esc(a.p.id)+'">Ok</button></div>';
  }).join('')+'</div>';
}

var lzBusy=false;
/* +/− lezione: corregge di 1 il totale rimasto agendo sul pacchetto più vecchio ancora con lezioni (+ : se sono tutti esauriti, sul più recente) */
async function lezioneDelta(d){
  if(lzBusy)return;
  var P=pacOf(iuid);
  if(!P.length){modal('<h3>Nessun pacchetto</h3><p>Aggiungi prima un pacchetto con + Pacchetto.</p><div class="mrow"><button class="pri" data-act="mclose">Ok</button></div>');return}
  var att=P.filter(function(p){return restOf(p)>0}),p=att[0]||(d>0?P[P.length-1]:null);
  if(!p){modal('<h3>Nessuna lezione da togliere</h3><p>Tutti i pacchetti sono esauriti.</p><div class="mrow"><button class="pri" data-act="mclose">Ok</button></div>');return}
  lzBusy=true;
  try{
    var tot=p.tot+d,prima=p.tot,pkData=p.data,pkId=String(p.id);
    if(tot<1){if(dbPac){await dbPac.doc(String(p.id)).delete()}PAC=PAC.filter(function(x){return x!==p})}
    else{p.tot=tot;if(dbPac)await dbPac.doc(String(p.id)).update({tot:tot})}
    /* voce nel registro: quando, e chi era collegato (non conta come ingresso e non scala lezioni) */
    var n=new Date(),lg={uid:String(iuid),day:iso(n),ent:hm(n.getHours()*60+n.getMinutes()),usc:'',note:'',pid:'',adj:d,pk:pkId,pkData:pkData,da:prima,a:Math.max(0,tot),by:(window.CARMA&&window.CARMA.chi)||''};
    try{if(dbIng)await dbIng.add(lg);else{lg.id='i'+(++iid);ING.push(lg)}}catch(e2){console.warn('Voce di registro non salvata',e2)}
    listIng();
  }catch(err){modal('<h3>Modifica non salvata</h3><p>Riprova.</p><div class="mrow"><button class="pri" data-act="mclose">Ok</button></div>');listIng()}
  finally{lzBusy=false}
}
async function delPac(id){
  if(dbPac){if(!await delDoc(dbPac,id)){delFail();return}}     /* prima il pacchetto: se non si elimina, gli ingressi restano collegati */
  var linked=ING.filter(function(x){return String(x.pid)===String(id)});
  for(var i=0;i<linked.length;i++){linked[i].pid='';if(dbIng){try{await dbIng.doc(String(linked[i].id)).update({pid:''})}catch(e){}}}
  PAC=PAC.filter(function(x){return String(x.id)!==String(id)});
  listIng();delEnd();
}
async function dropUserFromPac(id){

}

async function uploadDoc(uid,k,file){
  var u=find(uid);if(!u)return;
  st('dstat','Caricamento in corso…');
  try{
    var blob=file;
    if(/^image\//.test(file.type))blob=await shrink(file);
    else if(file.type!=='application/pdf'){st('dstat','Formato non supportato: scegli una foto o un PDF.');return}
    if(blob.size>15*1024*1024){st('dstat','File troppo grande (massimo 15 MB).');return}
    var patch={},old=u[k+'Id'];
    if(caps.assets){var a=await caps.assets.upload(blob);patch[k+'Id']=a.id;patch[k+'Type']=blob.type;patch[k+'Blob']=null}
    else if(dbCol){st('dstat','Archivio documenti non disponibile per questo profilo.');return}
    else{patch[k+'Blob']=blob;patch[k+'Id']=null}
    Object.keys(patch).forEach(function(x){u[x]=patch[x]});
    if(dbCol){var dp={};dp[k+'Id']=patch[k+'Id'];dp[k+'Type']=blob.type;await dbCol.doc(String(u.id)).update(dp)}
    if(old&&caps.assets&&old!==patch[k+'Id']){try{await caps.assets.delete(old)}catch(e){}}
    openUser(uid);st('dstat','Caricato: '+dkOf(k)[2]+'.');
    if(cur==='utenti'&&document.getElementById('ulist'))listUtenti();
  }catch(e){st('dstat','Caricamento non riuscito. Riprova.')}
}

// ---- Eventi: creazione e gestione, con file allegati ----
// Evento: {id, t:titolo, day, ent:inizio, usc:fine, luogo, desc, files:[{id|blob, name, type, size}]}
var EVT=[], dbEvt=null, eid=0, evm=false, esel={}, evq='', evid=null, evF=[], evRm=[];
var EVMAX=15*1024*1024, EVFILES=10;
(function(){
  var t=new Date();
  EVT.push({id:'e1',t:'Open day autunnale',day:iso(addDays(t,9)),ent:'10:00',usc:'13:00',luogo:'Palestra, sala principale',desc:'Giornata aperta con prove gratuite dei corsi e consulenza con gli istruttori.',files:[]});
  EVT.push({id:'e2',t:'Workshop alimentazione',day:iso(addDays(t,-14)),ent:'18:30',usc:'20:00',luogo:'Sala conferenze',desc:'',files:[]});
})();
var MIME={pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif'};
function guessType(name,type){if(type)return type;var m=/\.([a-z0-9]+)$/i.exec(name||'');return (m&&MIME[m[1].toLowerCase()])||'application/octet-stream'}
function fsize(n){return n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1).replace('.',',')+' MB'}
function findE(id){return EVT.filter(function(x){return String(x.id)===String(id)})[0]}
function timeTxt(e){return e.ent?e.ent+(e.usc?'–'+e.usc:''):'Giornata intera'}
function evStat(){var n=EVT.filter(function(e){return e.day>=iso(new Date())}).length;return n?n+' in programma':'Nessun evento in programma'}
function renderEventi(){
  document.getElementById('main').innerHTML='<div class="uh"><div><h2>Eventi</h2><p class="sub" id="evcount"></p></div><div class="uact">'+
   '<button class="ab pri" data-act="ev_add" aria-label="Nuovo evento"><span class="i">+</span><span class="t">Crea</span></button>'+
   '<button class="ab" id="evbdel" data-act="ev_del" aria-label="Elimina eventi"><span class="i">−</span><span class="t">Elimina</span></button></div></div>'+
   '<input class="search" id="evsearch" type="search" placeholder="Cerca un evento…" value="'+esc(evq)+'"><div id="evdbar"></div><div id="evlist"></div>';
  listEv();
}
function evRow(e,past){
  var d=parseIso(e.day),n=(e.files||[]).length;
  return '<div class="urow'+(esel[e.id]?' sel':'')+'" data-erow="'+esc(e.id)+'" style="cursor:pointer;align-items:center">'+(evm?'<input type="checkbox"'+(esel[e.id]?' checked':'')+' aria-label="Seleziona">':'')+
   '<div class="evd'+(past?' past':'')+'"><b>'+d.getDate()+'</b><span>'+MESI3[d.getMonth()]+'</span></div>'+
   '<div class="cells two"><b>'+esc(e.t)+'</b><span>'+GIORNI3[d.getDay()]+' '+fdate(e.day)+' · '+esc(timeTxt(e))+(e.luogo?' · '+esc(e.luogo):'')+(n?' · <span class="evc">'+IC.clip+n+'</span>':'')+'</span></div></div>';
}
function listEv(){
  if(!document.getElementById('evlist'))return;
  var q=evq.toLowerCase().trim(),today=iso(new Date()),n=Object.keys(esel).length;
  var L=EVT.filter(function(e){return !q||(e.t+' '+(e.luogo||'')).toLowerCase().indexOf(q)>-1});
  var up=L.filter(function(e){return e.day>=today}).sort(function(a,b){return (a.day+(a.ent||'')).localeCompare(b.day+(b.ent||''))});
  var pa=L.filter(function(e){return e.day<today}).sort(function(a,b){return (b.day+(b.ent||'')).localeCompare(a.day+(a.ent||''))});
  document.getElementById('evcount').textContent=EVT.length?EVT.length+(EVT.length===1?' evento':' eventi'):'Nessun evento';
  document.getElementById('evbdel').classList.toggle('danger',evm);
  document.getElementById('evdbar').innerHTML=evm?'<div class="dbar"><span>Seleziona gli eventi da eliminare ('+n+')</span><div><button data-act="ev_cancel">Annulla</button><button class="danger" data-act="ev_confirm"'+(n?'':' disabled')+'>Elimina</button></div></div>':'';
  var h='';
  if(up.length)h+='<h3 class="ih" style="margin-top:6px">In programma</h3>'+up.map(function(e){return evRow(e,false)}).join('');
  if(pa.length)h+='<h3 class="ih">Passati</h3>'+pa.map(function(e){return evRow(e,true)}).join('');
  if(!h)h=EVT.length?'<div class="empty">Nessun evento trovato.</div>':'<div class="empty">Nessun evento. Creane uno con +.</div>';
  document.getElementById('evlist').innerHTML=h;
}
function refreshEv(){if(cur==='home')render();else if(cur==='eventi')listEv()}

async function evDl(id,i){

// ---- creazione / modifica ----
function evListHtml(){
  return evF.length?evF.map(function(f,i){
    return '<div class="fdoc"><span class="fic">'+IC.clip+'</span><div class="fnm"><b>'+esc(f.name)+'</b><small>'+esc(fsize(f.size||0))+(f.blob&&!f.id?' · da salvare':'')+'</small></div><div class="fbt"><button class="ib" type="button" data-act="ev_frm" data-i="'+i+'" aria-label="Rimuovi '+esc(f.name)+'" title="Rimuovi"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div></div>';
  }).join(''):'<div class="status">Nessun allegato.</div>';

function evFRefresh(){var l=document.getElementById('evfl');if(l)l.innerHTML=evListHtml()}
function evForm(id){
  var e=id?findE(id):null;evid=e?e.id:null;evRm=[];
  evF=e?(e.files||[]).map(function(f){return {id:f.id||null,blob:f.blob||null,name:f.name,type:f.type,size:f.size}}):[];
  var o=e||{t:'',day:iso(new Date()),ent:'',usc:'',luogo:'',desc:''};
  modal('<h3>'+(e?'Modifica evento':'Nuovo evento')+'</h3>'+
   '<label>Titolo<input id="ev_t" type="text" placeholder="es. Open day, Workshop…"></label>'+
   '<label>Data<input id="ev_d" type="date"></label>'+
   '<div class="frow"><label>Inizio (facoltativo)<input id="ev_e" type="time"></label><label>Fine (facoltativa)<input id="ev_u" type="time"></label></div>'+
   '<label>Luogo<input id="ev_l" type="text"></label>'+
   '<label>Descrizione<textarea id="ev_n"></textarea></label>'+
   '<div class="fdocs"><b>Allegati</b><div id="evfl" style="display:flex;flex-direction:column;gap:8px"></div>'+

  evFRefresh();

function evAddFiles(list){
  var msg=[];
  for(var i=0;i<list.length;i++){
    var f=list[i];
    if(evF.length>=EVFILES){msg.push('Massimo '+EVFILES+' file per evento.');break}
    if(f.size>EVMAX){msg.push('«'+f.name+'» supera i 15 MB.');continue}
    evF.push({id:null,blob:f,name:f.name,type:guessType(f.name,f.type),size:f.size});
  }
  evFRefresh();st('evfs',msg.length?msg.join(' '):'Allegati pronti: si salvano con Salva.');
}
async function saveEv(){
  var t=document.getElementById('ev_t').value.trim(),day=document.getElementById('ev_d').value,en=document.getElementById('ev_e').value,us=document.getElementById('ev_u').value;
  if(!t){document.getElementById('ev_t').focus();st('ev_st','Scrivi il titolo dell’evento.');return}
  if(!day){st('ev_st','Scegli la data.');return}
  if(us&&!en){st('ev_st','Indica anche l’ora di inizio.');return}
  if(en&&us&&tmin(us)<=tmin(en)){st('ev_st','La fine deve essere dopo l’inizio.');return}
  var nw=evF.filter(function(f){return f.blob&&!f.id}).length;
  if(nw&&dbEvt&&!caps.assets){st('ev_st','Archivio file non disponibile per questo profilo: rimuovi gli allegati per salvare.');return}
  var b=document.getElementById('ev_sv');b.disabled=true;b.textContent='Salvataggio…';
  try{
    var files=[];
    for(var i=0;i<evF.length;i++){
      var f=evF[i];
      if(f.blob&&!f.id&&caps.assets){var a=await caps.assets.upload(f.blob);files.push({id:a.id,name:f.name,type:f.type,size:f.size})}
      else if(f.id)files.push({id:f.id,name:f.name,type:f.type,size:f.size});
      else files.push({id:null,blob:f.blob,name:f.name,type:f.type,size:f.size});
    }
    var o={t:t,day:day,ent:en,usc:us,luogo:document.getElementById('ev_l').value.trim(),desc:document.getElementById('ev_n').value.trim(),files:files};
    if(evid){var e=findE(evid);Object.keys(o).forEach(function(k){e[k]=o[k]});if(dbEvt)await dbEvt.doc(String(evid)).update(o)}
    else{if(dbEvt)await dbEvt.add(o);else{o.id='e'+(++eid)+'_'+Date.now();EVT.push(o)}}
    if(caps.assets){for(var j=0;j<evRm.length;j++){try{await caps.assets.delete(evRm[j])}catch(x){}}}
    closeModal();listEv();
  }catch(err){b.disabled=false;b.textContent='Salva';st('ev_st','Salvataggio non riuscito. Riprova.')}
}
async function delEv(ids){
  for(var i=0;i<ids.length;i++){
    var e=findE(ids[i]);if(!e)continue;
    if(caps.assets){for(var j=0;j<(e.files||[]).length;j++){if(e.files[j].id){try{await caps.assets.delete(e.files[j].id)}catch(x){}}}}
    if(dbEvt){if(!await delDoc(dbEvt,e.id))continue}
  }
  if(!dbEvt||!delErr)EVT=EVT.filter(function(x){return ids.indexOf(String(x.id))<0});
  esel={};evm=false;listEv();
  delEnd();
}

document.addEventListener('change',function(e){

document.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');
  if(a){var k=a.getAttribute('data-act'),id=a.getAttribute('data-id'),i=+a.getAttribute('data-i');
    if(k==='ev_add')evForm(null);
    else if(k==='ev_edit')evForm(id);

    else if(k==='ev_view')evView(id,i);
    else if(k==='ev_dl')evDl(id,i);
    else if(k==='ev_back')evDetail(id);
    else if(k==='ev_del'){evm=!evm;esel={};listEv()}

    else if(k==='ev_confirm'){var n=Object.keys(esel).length;if(!n)return;modal('<h3>Elimina eventi</h3><p>Vuoi eliminare '+n+(n===1?' evento selezionato':' eventi selezionati')+' con i relativi allegati? L’operazione non si può annullare.</p><div class="mrow"><button data-act="mclose">Annulla</button><button class="danger" data-act="ev_dodel">Elimina</button></div>')}
    else if(k==='ev_rm'){var ee=findE(id);modal('<h3>Elimina evento</h3><p>Vuoi eliminare «'+esc(ee?ee.t:'')+'» con i relativi allegati? L’operazione non si può annullare.</p><div class="mrow"><button data-act="mclose">Annulla</button><button class="danger" data-act="ev_dodel" data-id="'+esc(id)+'">Elimina</button></div>')}
    else if(k==='ev_dodel')delEv(id?[String(id)]:Object.keys(esel));
    return;
  }
  if(cur!=='eventi')return;
  var r=e.target.closest('[data-erow]');
  if(r){var i2=r.getAttribute('data-erow');if(evm){if(esel[i2])delete esel[i2];else esel[i2]=1;listEv()}else evDetail(i2)}
});

// ---- Scalare le lezioni: quando arriva l'orario di una voce del calendario, per ogni utente assegnato si registra
// in automatico un ingresso che scala una lezione dal pacchetto (il più vecchio con lezioni rimaste).
// La voce ricorda gli utenti già conteggiati (sc), così non si scala due volte.
var rdy={}, autoBusy=false;
async function addAutoIng(it,uid){
  var id='auto_'+it.id+'_'+uid;
  if(findI(id))return;
  var o={uid:String(uid),day:it.day,ent:hm(it.s),usc:hm(it.e),note:ctitle(it),pid:autoPid(uid),cid:String(it.id),auto:true};
  if(dbIng){try{await dbIng.doc(id).set(o)}catch(e){}}
  o.id=id;if(!findI(id))ING.push(o);
}
async function autoIng(){
  if(autoBusy)return;
  if(dbCal&&!(rdy.cal&&rdy.ing&&rdy.pac&&rdy.u))return;
  autoBusy=true;
  try{
    var n=new Date(),key=iso(n)+' '+hm(n.getHours()*60+n.getMinutes()),changed=false;
    var L=CAL.filter(function(it){return (it.day+' '+hm(it.s))<=key}).sort(function(a,b){return (a.day+hm(a.s)).localeCompare(b.day+hm(b.s))});
    for(var i=0;i<L.length;i++){
      var it=L[i],done=(it.sc||[]).map(String),todo=(it.u||[]).map(String).filter(function(u){return done.indexOf(u)<0&&find(u)});
      if(!todo.length)continue;
      for(var j=0;j<todo.length;j++)await addAutoIng(it,todo[j]);
      await saveC(it,{sc:done.concat(todo)});changed=true;
    }
    if(changed){
      updBadge();
      if(cur==='home'||cur==='avvisi')render();
      else if(cur==='utenti'&&iuid&&document.getElementById('ilist'))listIng();
    }
  }finally{autoBusy=false}
}
setInterval(autoIng,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)autoIng()});
setView(window.innerWidth>=768?'tablet':'mobile');
render();
autoIng();
</script>
