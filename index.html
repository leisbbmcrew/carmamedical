<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carma Medical Wellness</title>
<style>
:root{--bg:#f3f7f6;--surface:#fff;--text:#12302b;--muted:#5d7872;--line:#dbe6e3;--brand:#0f766e;--brand-soft:#d9f0ec;--c1:#0f766e;--c2:#c2410c;--c3:#1d4ed8;--c4:#7e22ce;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a18;--surface:#152724;--surface:#152724;--text:#e6f2ef;--muted:#92b0aa;--line:#24403b;--brand:#2dd4bf;--brand-soft:#173833;--c1:#2dd4bf;--c2:#fb923c;--c3:#60a5fa;--c4:#c084fc;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a18;--surface:#152724;--text:#e6f2ef;--muted:#92b0aa;--line:#24403b;--brand:#2dd4bf;--brand-soft:#173833;--c1:#2dd4bf;--c2:#fb923c;--c3:#60a5fa;--c4:#c084fc;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.preview{display:flex;gap:6px;justify-content:center;padding:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.preview button{border:1px solid var(--line);background:none;color:var(--muted);padding:6px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.preview button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.stage{display:flex;justify-content:center;padding:0}
.app{width:100%;background:var(--bg);min-height:calc(100vh - 54px);position:relative;display:flex;flex-direction:column}
.stage.mobile .app{max-width:400px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.stage.tablet .app{max-width:1024px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
header h1{font-size:18px;margin:0;line-height:1.2}
header small{color:var(--muted);font-size:13px}
.layout{display:flex;flex:1;min-height:0}
nav.side{display:none}
main{flex:1;padding:20px;padding-bottom:90px}
h2{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;color:inherit;font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--brand)}
.card .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--col);background:color-mix(in srgb,var(--col) 14%,transparent)}
.card .ic svg,.tab svg,.side button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h3{margin:0;font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card .stat{margin-top:auto;font-size:13px;color:var(--col);font-weight:600}
.panel{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
.back{background:none;border:none;color:var(--brand);font:inherit;cursor:pointer;padding:0 0 12px}
.tabbar{position:sticky;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);font:inherit;font-size:12px;padding:6px 2px;cursor:pointer}
.tab[aria-current="true"]{color:var(--brand);font-weight:600}
.stage.tablet nav.side{display:flex;flex-direction:column;gap:4px;width:220px;padding:16px 12px;background:var(--surface);border-right:1px solid var(--line)}
.stage.tablet .side button{display:flex;align-items:center;gap:12px;background:none;border:none;color:var(--muted);font:inherit;padding:12px 14px;border-radius:12px;cursor:pointer;text-align:left}
.stage.tablet .side button[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.stage.tablet .tabbar{display:none}
.stage.tablet main{padding:28px;padding-bottom:28px}
.stage.tablet .grid{grid-template-columns:1fr 1fr}
.stage.tablet .card{min-height:170px}
.uh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.uact{display:flex;gap:8px;flex-shrink:0}
.ab{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:15px;font-weight:600;cursor:pointer;width:42px;height:42px;border-radius:50%;padding:0}
.ab .i{font-size:26px;line-height:1;font-weight:400}.ab .t{display:none}
.ab.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.ab.danger{background:#dc2626;border-color:#dc2626;color:#fff}
.stage.tablet .ab{width:auto;height:auto;border-radius:12px;padding:10px 18px}
.stage.tablet .ab .i{display:none}.stage.tablet .ab .t{display:inline}
.search{width:100%;padding:12px 14px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit}
.dbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--brand-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.dbar div{display:flex;gap:8px}
.dbar button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.dbar .danger{background:#dc2626;border-color:#dc2626;color:#fff}
.dbar button:disabled{opacity:.5;cursor:default}
.urow{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.urow.sel{border-color:#dc2626}
.urow input[type=checkbox]{width:20px;height:20px;margin-top:10px;flex-shrink:0;accent-color:#dc2626}
.av{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex-shrink:0}
.cells{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.cells b{color:var(--text);font-size:16px}
.cells span{overflow:hidden;text-overflow:ellipsis}
.uhead{display:none}
.stage.tablet .uhead{display:grid;padding:0 14px 8px 68px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stage.tablet .cells{display:grid;grid-template-columns:1.3fr .8fr 1.5fr 1fr 1.7fr 1fr;gap:12px;align-items:center}
.stage.tablet .uhead{grid-template-columns:1.3fr .8fr 1.5fr 1fr 1.7fr 1fr;gap:12px}
.stage.tablet .urow{align-items:center}
.stage.tablet .urow input[type=checkbox]{margin-top:0}
.stage.tablet .cells{font-size:13px}.stage.tablet .cells b{font-size:15px}
.stage.tablet .app,.stage.tablet .app{max-width:1024px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--surface);color:var(--text);border-radius:18px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.mbox h3{margin:0 0 4px}.mbox label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.mbox input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.mrow button{padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;cursor:pointer}
.mrow .pri{background:var(--brand);border-color:var(--brand);color:#fff}.mrow .danger{background:#dc2626;border-color:#dc2626;color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.idbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.idrow{display:flex;gap:10px;flex-wrap:wrap}
.drop{flex:1;min-width:130px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.drop input{font-size:12px;padding:6px;max-width:100%}
.drop img{display:none;width:100%;max-height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.idbox button{padding:10px 14px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:#fff;font:inherit;cursor:pointer}
.idbox .idrow button{background:var(--surface);color:var(--text);border-color:var(--line)}
.idbox button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted)}
.dc{font-style:normal;font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}.det dt{color:var(--muted)}.det dd{margin:0;word-break:break-word}
.btns{display:flex;gap:6px}
.pb{flex:1;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer}
.pb.cam{background:var(--brand);border-color:var(--brand);color:#fff}
.idbox pre{white-space:pre-wrap;font-size:11px;max-height:160px;overflow:auto;margin:6px 0 0;color:var(--muted)}
.idbox summary{font-size:12px;color:var(--muted);cursor:pointer}
/* login: attivare a programma finito */
#login{display:none;position:absolute;inset:0;z-index:5;background:var(--bg);align-items:center;justify-content:center;padding:24px}
#login.on{display:flex}
.lbox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lbox .logo{margin:0 auto;width:64px;height:64px;font-size:30px;border-radius:18px}
.lbox input{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit}
.lbox button{padding:12px;border:none;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}

</style>
</head>
<body>
<div class="preview" role="group" aria-label="Anteprima">
  <button id="bm" aria-pressed="true">Mobile</button>
  <button id="bt" aria-pressed="false">Tablet</button>
</div>
<div class="stage mobile" id="stage">
<div class="app">
  <div id="login" aria-hidden="true">
    <div class="lbox">
      <div class="logo">C</div>
      <h2>Carma Medical Wellness</h2>
      <input type="email" placeholder="Email" autocomplete="username">
      <input type="password" placeholder="Password" autocomplete="current-password">
      <button type="button" onclick="document.getElementById('login').classList.remove('on')">Accedi</button>
    </div>
  </div>
  <header>
    <div class="logo">C</div>
    <div><h1>Carma Medical Wellness</h1><small>Gestione palestra</small></div>
  </header>
  <div class="layout">
    <nav class="side" id="side"></nav>
    <main id="main"></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
</div>
<script>
// Impostare a true quando il programma è finito, per mostrare la schermata di login
var LOGIN_ATTIVO = false;
if (LOGIN_ATTIVO) { var l = document.getElementById('login'); l.classList.add('on'); l.setAttribute('aria-hidden','false'); }

var I = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>',
  users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 010 6.4M18 14.4c2 .7 3.5 2.5 3.5 5.6"/></svg>',
  plan:'<svg viewBox="0 0 24 24"><path d="M2 9v6M5 6v12M19 6v12M22 9v6M5 12h14"/></svg>',
  cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  ev:'<svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>'
};
var S = [
  {id:'utenti',t:'Utenti',d:'Iscritti, anagrafica e abbonamenti',i:I.users,c:'var(--c1)',s:'Gestisci iscritti'},
  {id:'schede',t:'Schede allenamento',d:'Crea e assegna programmi di allenamento',i:I.plan,c:'var(--c2)',s:'Gestisci schede'},
  {id:'calendario',t:'Calendario',d:'Corsi, appuntamenti e prenotazioni',i:I.cal,c:'var(--c3)',s:'Apri calendario'},
  {id:'eventi',t:'Eventi',d:'Open day, workshop e iniziative',i:I.ev,c:'var(--c4)',s:'Gestisci eventi'}
];
var cur = 'home';
function render(){
  var m = document.getElementById('main'), h = '';
  if (cur === 'home') {
    h = '<h2>Benvenuto</h2><p class="sub">Scegli una sezione per iniziare.</p><div class="grid">' +
      S.map(function(x){return '<button class="card" style="--col:'+x.c+'" data-go="'+x.id+'"><div class="ic">'+x.i+'</div><h3>'+x.t+'</h3><p>'+x.d+'</p><span class="stat">'+x.s+' →</span></button>'}).join('') + '</div>';
  } else {
    var x = S.filter(function(y){return y.id===cur})[0];
    h = '<button class="back" data-go="home">← Home</button><h2>'+x.t+'</h2><p class="sub">'+x.d+'</p><div class="panel">Sezione in sviluppo.</div>';
  }
  m.innerHTML = h;
  if (cur === 'utenti') renderUtenti();
  var items = [{id:'home',t:'Home',i:I.home}].concat(S.map(function(x){return {id:x.id,t:x.id==='schede'?'Schede':x.t,i:x.i}}));
  document.getElementById('tabbar').innerHTML = items.map(function(x){return '<button class="tab" data-go="'+x.id+'"'+(x.id===cur?' aria-current="true"':'')+'>'+x.i+'<span>'+x.t+'</span></button>'}).join('');
  document.getElementById('side').innerHTML = items.map(function(x){var f=x.id==='schede'?'Schede allenamento':x.t;return '<button data-go="'+x.id+'"'+(x.id===cur?' aria-current="true"':'')+'>'+x.i+'<span>'+f+'</span></button>'}).join('');
}
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-go]'); if (b) { cur = b.getAttribute('data-go'); render(); window.scrollTo(0,0); }
});
function setView(v){
  document.getElementById('stage').className = 'stage ' + v;
  document.getElementById('bm').setAttribute('aria-pressed', v==='mobile');
  document.getElementById('bt').setAttribute('aria-pressed', v==='tablet');
}
document.getElementById('bm').onclick = function(){setView('mobile')};
document.getElementById('bt').onclick = function(){setView('tablet')};
var uid = 10;
var U = [
 {id:1,n:'Marco',c:'Rossi',d:'1985-03-12',cf:'RSSMRC85C12A462X',t:'333 1234567',e:'marco.rossi@email.it',ci:'Ascoli Piceno'},
 {id:2,n:'Giulia',c:'Bianchi',d:'1992-07-25',cf:'BNCGLI92L65A462K',t:'347 7654321',e:'giulia.bianchi@email.it',ci:'San Benedetto'},
 {id:3,n:'Luca',c:'Ferrari',d:'1978-11-03',cf:'FRRLCU78S03A462P',t:'320 1122334',e:'luca.ferrari@email.it',ci:'Ascoli Piceno'}
];
var uq = '', dm = false, sel = {}, draft = {front:null,back:null};
var dbCol = null, caps = {sample:null,assets:null,down:null};
var sState = window.claude && window.claude.use ? 'pending' : 'local';
function sampleMsg(){
  if(sState==='ok') return 'Carica fronte e/o retro per compilare i campi in automatico.';
  if(sState==='local') return 'Carica fronte e/o retro per compilare i campi in automatico (la prima lettura scarica il modello di riconoscimento: serve internet).';
  if(sState==='pending') return 'Verifica della lettura automatica in corso…';
  if(sState==='none') return 'Lettura automatica non disponibile: compila i campi a mano.';
  return 'Lettura automatica non disponibile per questo profilo o in questa vista: compila i campi a mano.';
}
(async function(){
  var c = window.claude; if(!c || !c.use) return;
  c.use('assets').then(function(x){caps.assets=x}).catch(function(){});
  c.use('downloads').then(function(x){caps.down=x}).catch(function(){});
  c.use('sample').then(function(x){
    caps.sample=x; sState=x?'ok':'off';
    var r=document.getElementById('rstat'), br=document.getElementById('bread');
    if(r&&!draft.front&&!draft.back) r.textContent=sampleMsg();
    if(br&&x&&(draft.front||draft.back)) br.disabled=false;
  }).catch(function(){sState='off'});
  try{
    var db = await c.use('db');
    if(db){
      dbCol = db.collection('utenti'); U = [];
      dbCol.onSnapshot(function(s){
        U = s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o});
        if(cur==='utenti' && document.getElementById('ulist')) listUtenti();
      }, function(){});
    }
  }catch(e){}
})();
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fdate(s){if(!s)return '—';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function filtered(){
  var q=uq.toLowerCase().trim();
  return U.filter(function(u){return !q||[u.n,u.c,u.cf,u.t,u.e,u.ci].join(' ').toLowerCase().indexOf(q)>-1})
   .sort(function(a,b){return (a.c+a.n).localeCompare(b.c+b.n)});
}
function renderUtenti(){
  document.getElementById('main').innerHTML =
   '<div class="uh"><div><h2>Utenti</h2><p class="sub" id="ucount"></p></div><div class="uact">'+
   '<button class="ab pri" data-act="add" aria-label="Crea utente"><span class="i">+</span><span class="t">Crea</span></button>'+
   '<button class="ab" id="bdel" data-act="del" aria-label="Elimina utenti"><span class="i">−</span><span class="t">Elimina</span></button></div></div>'+
   '<input class="search" id="usearch" type="search" placeholder="Cerca per nome, codice fiscale, email…" value="'+esc(uq)+'">'+
   '<div id="dbar"></div><div id="ulist"></div>';
  document.getElementById('usearch').addEventListener('input',function(e){uq=e.target.value;listUtenti()});
  listUtenti();
}
function hasDoc(u){return !!(u.frontId||u.backId||u.frontBlob||u.backBlob)}
function listUtenti(){
  var L = filtered(), n = Object.keys(sel).length;
  document.getElementById('ucount').textContent = L.length + (L.length===1?' utente':' utenti');
  document.getElementById('dbar').innerHTML = dm ? '<div class="dbar"><span>Seleziona gli utenti da eliminare ('+n+')</span><div><button data-act="cancel">Annulla</button><button class="danger" data-act="confirmdel"'+(n?'':' disabled')+'>Elimina</button></div></div>' : '';
  document.getElementById('bdel').classList.toggle('danger', dm);
  var h = L.length ? '<div class="uhead"><span>Nominativo</span><span>Nascita</span><span>Codice fiscale</span><span>Telefono</span><span>Email</span><span>Città</span></div>' : '<div class="empty">Nessun utente trovato.</div>';
  h += L.map(function(u){
    return '<div class="urow'+(sel[u.id]?' sel':'')+'" data-row="'+esc(u.id)+'">'+(dm?'<input type="checkbox"'+(sel[u.id]?' checked':'')+' aria-label="Seleziona">':'')+
    '<div class="av">'+esc((u.n[0]||'')+(u.c[0]||'')).toUpperCase()+'</div><div class="cells"><b>'+esc(u.n+' '+u.c)+(hasDoc(u)?' <i class="dc">documento</i>':'')+'</b><span>Nato il '+fdate(u.d)+'</span><span>'+esc(u.cf||'—')+'</span><span>'+esc(u.t||'—')+'</span><span>'+esc(u.e||'—')+'</span><span>'+esc(u.ci||'—')+'</span></div></div>';
  }).join('');
  document.getElementById('ulist').innerHTML = h;
}
function modal(html){var m=document.getElementById('modal');if(!m){m=document.createElement('div');m.id='modal';m.className='modal';document.body.appendChild(m)}m.innerHTML='<div class="mbox">'+html+'</div>'}
function closeModal(){var m=document.getElementById('modal');if(m)m.remove()}
function st(id,t){var e=document.getElementById(id);if(e)e.textContent=t}
var FIELDS=[['n','Nome'],['c','Cognome'],['d','Data di nascita','date'],['cf','Codice fiscale'],['t','Telefono','tel'],['e','Email','email'],['ci','Città di residenza'],['dn','N. documento'],['ds','Scadenza documento','date']];
function dropHtml(side,label){
  return '<div class="drop">'+label+'<div class="btns"><label class="pb cam">📷 Scatta foto<input type="file" accept="image/*" capture="environment" data-side="'+side+'" hidden></label>'+
   '<label class="pb">Scegli file<input type="file" accept="image/*" data-side="'+side+'" hidden></label></div><img id="pv_'+side+'" alt="Anteprima '+label.toLowerCase()+'"></div>';
}
function addForm(){
  draft={front:null,back:null};
  modal('<h3>Nuovo utente</h3><div class="idbox"><b>Documento d’identità</b>'+
   '<div class="idrow">'+dropHtml('front','Fronte')+dropHtml('back','Retro')+'</div>'+
   '<button id="bread" data-act="read" disabled>Leggi dati dal documento</button><div class="status" id="rstat">'+sampleMsg()+'</div><details id="rawd" hidden><summary>Mostra testo letto</summary><pre id="rawt"></pre></details></div>'+
   FIELDS.map(function(x){return '<label>'+x[1]+(x[0]==='n'||x[0]==='c'?' *':'')+'<input id="f_'+x[0]+'" type="'+(x[2]||'text')+'"></label>'}).join('')+
   '<div class="status" id="sstat"></div><div class="mrow"><button data-act="mclose">Annulla</button><button class="pri" id="bsave" data-act="msave">Salva</button></div>');
}
function shrink(file){return new Promise(function(res,rej){
  var im=new Image(),u=URL.createObjectURL(file);
  im.onload=function(){var s=Math.min(1,1600/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(function(b){b?res(b):rej()},'image/jpeg',0.85)};
  im.onerror=function(){rej()};im.src=u})}
async function pickFile(side,file){
  try{
    var b=await shrink(file); draft[side]=b;
    var pv=document.getElementById('pv_'+side); pv.src=URL.createObjectURL(b); pv.style.display='block';
    var br=document.getElementById('bread'); if(br) br.disabled=!(caps.sample||sState==='local');
  }catch(e){ st('rstat','Immagine non valida: scegli una foto (JPG o PNG).') }
}
// Lettura documento direttamente nel browser (Tesseract.js), senza server e senza API
var DIG={O:'0',Q:'0',D:'0',I:'1',L:'1',Z:'2',S:'5',B:'8',G:'6'}, LET={'0':'O','1':'I','2':'Z','5':'S','8':'B','6':'G'};
function dfix(s){return s.replace(/[A-Z]/g,function(c){return DIG[c]||c})}
function lfix(s){return s.replace(/[0-9]/g,function(c){return LET[c]||c})}
function ymd(s,kind){
  if(!/^\d{6}$/.test(s))return '';
  var y=+s.slice(0,2),m=+s.slice(2,4),d=+s.slice(4,6); if(m<1||m>12||d<1||d>31)return '';
  var cy=new Date().getFullYear()%100, Y=kind==='b'?(y>cy?1900:2000)+y:2000+y;
  return Y+'-'+('0'+m).slice(-2)+'-'+('0'+d).slice(-2);
}
function tcase(s){return s.toLowerCase().replace(/(^|[\s'’-])([a-zà-ÿ])/g,function(_,a,b){return a+b.toUpperCase()})}
function mrzCheck(s){var w=[7,3,1],t=0;for(var i=0;i<s.length;i++){var c=s.charAt(i),v=c==='<'?0:/\d/.test(c)?+c:c.charCodeAt(0)-55;t+=v*w[i%3]}return t%10}
function parseMRZ(t){
  var L=String(t).toUpperCase().split(/\n/).map(function(x){return x.replace(/[^A-Z0-9<]/g,'')}).filter(function(x){return x.length>=24});
  var l1,l2,l3;
  L.forEach(function(x){
    x=(x+'<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<').slice(0,30);
    var is2=/^\d{6}\d[MF<]\d{6}\d/.test(dfix(x.slice(0,7))+x.charAt(7)+dfix(x.slice(8,15)));
    var is3=x.indexOf('<<')>0&&/^[A-Z<]+$/.test(x);
    if(is2){if(!l2)l2=x}else if(is3){if(!l3)l3=x}else if(/^[ICA][A-Z<]/.test(x)&&/\d/.test(x.slice(5,14))){if(!l1)l1=x}
  });
  var o={};
  // date e numero documento solo se il carattere di controllo della riga torna
  if(l2){
    var b=dfix(l2.slice(0,6)); if(mrzCheck(b)===+dfix(l2.charAt(6))) o.data_nascita=ymd(b,'b');
    var e=dfix(l2.slice(8,14)); if(mrzCheck(e)===+dfix(l2.charAt(14))) o.scadenza=ymd(e,'e');
  }
  if(l3){var p=l3.split('<<'),c=tcase(p[0].replace(/[<0-9]/g,' ').trim()),n=tcase((p[1]||'').replace(/[<0-9]/g,' ').trim());
    if(/^[A-Za-zÀ-ÿ' ]{2,}$/.test(c))o.cognome=c; if(/^[A-Za-zÀ-ÿ' ]{2,}$/.test(n))o.nome=n}
  if(l1){var dn=l1.slice(5,14),ck=+dfix(l1.charAt(14));if(mrzCheck(dn)===ck||mrzCheck(dfix(dn))===ck)o.numero_documento=dn.replace(/</g,'')}
  return o;
}
var ODD=[1,0,5,7,9,13,15,17,19,21,2,4,18,20,11,3,6,8,12,14,16,10,22,25,24,23];
function cfCheck(c){var t=0;for(var i=0;i<15;i++){var ch=c.charAt(i),v=/\d/.test(ch)?+ch:ch.charCodeAt(0)-65;t+=i%2===0?ODD[v]:v}return String.fromCharCode(65+t%26)===c.charAt(15)}
function findCF(text){
  var cands=[];
  String(text).toUpperCase().split(/\n/).forEach(function(line){
    var s=line.replace(/[^A-Z0-9]/g,'');
    for(var i=0;i+16<=s.length;i++){
      var w=s.slice(i,i+16),f=lfix(w.slice(0,6))+dfix(w.slice(6,8))+lfix(w.charAt(8))+dfix(w.slice(9,11))+lfix(w.charAt(11))+dfix(w.slice(12,15))+lfix(w.charAt(15));
      if(/^[A-Z]{6}\d{2}[A-EHLMPRST]\d{2}[A-Z]\d{3}[A-Z]$/.test(f))cands.push(f);
    }
  });
  var ok=cands.filter(cfCheck);
  return ok.length?{cf:ok[0],ok:true}:(cands.length?{cf:cands[0],ok:false}:null);
}
var LABEL=/cognome|surname|nome|name|sesso|sex|nascita|birth|statura|height|cittadin|national|scadenza|expir|emission|rilascio|issue|residen|comune|luogo|data|date|codice|fiscal|repubblica|ministero|identit|carta|italian|firma|signature/i;
function allDates(t){
  var out=[],re=/(\d{1,2})\s*[\/\.\-]\s*(\d{1,2})\s*[\/\.\-]\s*(\d{4})/g,m,cy=new Date().getFullYear();
  while((m=re.exec(t))){var d=+m[1],mo=+m[2],y=+m[3];if(d>=1&&d<=31&&mo>=1&&mo<=12&&y>=1900&&y<=cy+12){var iso=y+'-'+('0'+mo).slice(-2)+'-'+('0'+d).slice(-2);if(out.indexOf(iso)<0)out.push(iso)}}
  return out.sort();
}
function parseFront(t){
  var lines=String(t).split(/\n/).map(function(x){return x.trim()}).filter(Boolean),o={};
  function letters(s){return s.replace(/[^A-Za-zÀ-ÿ' ]/g,' ').replace(/\s+/g,' ').trim()}
  function find(re){for(var i=0;i<lines.length;i++)if(re.test(lines[i]))return i;return -1}
  var used=-1;
  function value(i){for(var k=Math.max(i+1,used+1);k<=i+4&&k<lines.length;k++){var v=letters(lines[k]);if(v.length>=2&&v.length<=30&&!LABEL.test(v)){used=k;return tcase(v)}}return ''}
  var i=find(/^\W*cognome/i); if(i>-1){var c=value(i);if(c)o.cognome=c}
  i=find(/^\W*nome\b/i); if(i>-1){var n=value(i);if(n)o.nome=n}
  var ds=allDates(t), near=function(re){var j=find(re);return j>-1?allDates(lines.slice(j,j+3).join(' ')):[]};
  var nb=near(/nascita|birth/i), ne=near(/scadenza|expir/i);
  if(ds.length>=2){
    o.data_nascita=nb.length?nb[0]:ds[0];
    var mx=ds[ds.length-1];
    // la scadenza è la data più recente; con sole due date serve l'etichetta per distinguerla dall'emissione
    if(ds.length>=3||ne.indexOf(mx)>-1)o.scadenza=mx;
  }else if(ds.length===1){
    if(ne.length)o.scadenza=ds[0];else if(nb.length)o.data_nascita=ds[0];
  }
  i=find(/residenza|residence/i); if(i>-1){var r=letters((lines[i+1]||'').split(/[(,]/)[0]); if(r.length>2&&!LABEL.test(r))o.residenza=tcase(r)}
  var cf=findCF(t); if(cf){o.codice_fiscale=cf.cf;if(!cf.ok)o._cfWarn=1}
  var dn=String(t).toUpperCase().match(/\b[A-Z]{2}\s?\d{5}\s?[A-Z]{2}\b/); if(dn)o.numero_documento=dn[0].replace(/\s/g,'');
  return o;
}
var TESS_BASE=new URL('vendor/tesseract/',document.baseURI).href, TESS_LOCAL=false;
function addScript(src){return new Promise(function(ok,ko){var sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=function(){sc.remove();ko(new Error('net'))};document.head.appendChild(sc)})}
function loadTess(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  return addScript(TESS_BASE+'tesseract.min.js').then(function(){TESS_LOCAL=true;return window.Tesseract})
   .catch(function(){return addScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js').then(function(){return window.Tesseract})});
}
// ingrandisce, passa in grigio, aumenta il contrasto; con y0 taglia la parte bassa; con bin rende bianco/nero
function prep(blob,o){return new Promise(function(ok,ko){
  var im=new Image(),u=URL.createObjectURL(blob);
  im.onerror=function(){ko(new Error('img'))};
  im.onload=function(){
    var sy=Math.round(im.height*(o.y0||0)),sh=im.height-sy,s=(o.w||im.width)/im.width,cw=Math.round(im.width*s),ch=Math.round(sh*s);
    var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;var cx=cv.getContext('2d');
    cx.drawImage(im,0,sy,im.width,sh,0,0,cw,ch);
    var d=cx.getImageData(0,0,cw,ch),p=d.data,hist=new Array(256).fill(0),i,g,tot=cw*ch,acc=0,lo=0,hi=255;
    for(i=0;i<p.length;i+=4){g=Math.round(.299*p[i]+.587*p[i+1]+.114*p[i+2]);p[i]=g;hist[g]++}
    for(i=0;i<256;i++){acc+=hist[i];if(acc>=tot*.02){lo=i;break}}
    acc=0;for(i=255;i>=0;i--){acc+=hist[i];if(acc>=tot*.02){hi=i;break}}
    var rng=Math.max(1,hi-lo),h2=new Array(256).fill(0);
    for(i=0;i<p.length;i+=4){g=Math.max(0,Math.min(255,Math.round((p[i]-lo)*255/rng)));p[i]=g;h2[g]++}
    var tr=128;
    if(o.bin){var sum=0,sB=0,wB=0,mx=0;for(i=0;i<256;i++)sum+=i*h2[i];for(i=0;i<256;i++){wB+=h2[i];if(!wB)continue;var wF=tot-wB;if(!wF)break;sB+=i*h2[i];var mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>mx){mx=v;tr=i}}}
    for(i=0;i<p.length;i+=4){g=p[i];if(o.bin)g=g>tr?255:0;p[i]=p[i+1]=p[i+2]=g}
    cx.putImageData(d,0,0);
    cv.toBlob(function(b){URL.revokeObjectURL(u);b?ok(b):ko(new Error('img'))},'image/png');
  };
  im.src=u;
})}
async function ocr(blob,lang,params,onp){
  var T=await loadTess();
  var opts={logger:function(m){if(m.status==='recognizing text'&&onp)onp(m.progress)}};
  if(TESS_LOCAL){opts.workerPath=TESS_BASE+'worker.min.js';opts.corePath=TESS_BASE;opts.langPath=TESS_BASE+'lang'}
  var w=await T.createWorker(lang,1,opts);
  try{ if(params)await w.setParameters(params); var r=await w.recognize(blob); return r.data.text||'' }
  finally{ await w.terminate() }
}
function showRaw(txt){var d=document.getElementById('rawd'),p=document.getElementById('rawt');if(d&&p){p.textContent=txt;d.hidden=false}}
async function localRead(){
  var prog=function(p){st('rstat','Lettura in corso… '+Math.round(p*100)+'%')}, texts=[], mrzTexts=[];
  for(var s of ['front','back']){ if(draft[s]) texts.push(await ocr(await prep(draft[s],{w:2000}),'ita',null,prog)) }
  // riga di caratteri in basso (MRZ): provo in grigio e in bianco/nero e tengo il risultato più completo
  var mrz={}, src=draft.back||draft.front;
  for(var bin of [false,true]){
    var tx=await ocr(await prep(src,{y0:.55,w:2400,bin:bin}),'eng',{tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<',tessedit_pageseg_mode:'6'},prog);
    mrzTexts.push(tx); var m=parseMRZ(tx); if(Object.keys(m).length>Object.keys(mrz).length)mrz=m;
  }
  var fr=parseFront(texts.join('\n')), out={};
  [fr,mrz].forEach(function(o){Object.keys(o).forEach(function(k){if(o[k])out[k]=o[k]})});
  showRaw('--- TESTO ---\n'+texts.join('\n--- altra immagine ---\n')+'\n--- MRZ ---\n'+mrzTexts.join('\n--- altro tentativo ---\n'));
  return out;
}
async function readDoc(){
  var imgs=[draft.front,draft.back].filter(Boolean); if(!imgs.length||!(caps.sample||sState==='local')) return;
  var b=document.getElementById('bread'); b.disabled=true; st('rstat','Lettura in corso…');
  try{
    var r=caps.sample ? await caps.sample.json('Le immagini allegate sono il fronte e/o il retro di un documento d’identità (in quest’ordine: fronte, poi retro se presente). Estrai i dati e rispondi solo con un oggetto JSON con queste chiavi: nome, cognome, data_nascita (formato AAAA-MM-GG), codice_fiscale, residenza (solo città), numero_documento, scadenza (formato AAAA-MM-GG). Usa una stringa vuota per ciò che non è leggibile e non inventare nulla.',{images:imgs}) : await localRead();
    var m={n:r.nome,c:r.cognome,d:r.data_nascita,cf:r.codice_fiscale,ci:r.residenza,dn:r.numero_documento,ds:r.scadenza};
    var fl=0;Object.keys(m).forEach(function(k){var el=document.getElementById('f_'+k);if(el&&m[k]){el.value=String(m[k]).trim();fl++}});
    st('rstat',fl?'Dati compilati ('+fl+' campi): controllali prima di salvare.'+(r._cfWarn?' Codice fiscale da verificare.':(!r.codice_fiscale?' Codice fiscale non trovato.':'')):'Non sono riuscito a leggere il documento: prova con una foto più nitida o compila a mano.');
  }catch(e){ st('rstat',e&&e.message==='net'?'Impossibile scaricare il modello di lettura: serve una connessione internet.':'Lettura non riuscita: compila i campi a mano.') }
  b.disabled=false;
}
async function saveUser(){
  var o={}; FIELDS.forEach(function(x){o[x[0]]=document.getElementById('f_'+x[0]).value.trim()});
  if(!o.n||!o.c){document.getElementById(o.n?'f_c':'f_n').focus();return}
  o.cf=o.cf.toUpperCase();
  var has=draft.front||draft.back;
  if(has&&dbCol&&!caps.assets){st('sstat','Archivio documenti non disponibile per questo profilo: rimuovi le foto per salvare.');return}
  var b=document.getElementById('bsave'); b.disabled=true; b.textContent='Salvataggio…';
  try{
    for(var side of ['front','back']){ if(!draft[side])continue;
      if(caps.assets){var a=await caps.assets.upload(draft[side]);o[side+'Id']=a.id}
      else{o[side+'Blob']=draft[side]} }
    if(dbCol){await dbCol.add(o)} else {o.id='l'+(++uid);U.unshift(o);listUtenti()}
    closeModal();
  }catch(e){b.disabled=false;b.textContent='Salva';st('sstat','Salvataggio non riuscito. Riprova.')}
}
function find(id){return U.filter(function(u){return String(u.id)===String(id)})[0]}
function openUser(id){
  var u=find(id); if(!u)return;
  var rows=[['Nome',u.n+' '+u.c],['Data di nascita',fdate(u.d)],['Codice fiscale',u.cf],['Telefono',u.t],['Email',u.e],['Città',u.ci],['N. documento',u.dn],['Scadenza documento',fdate(u.ds)]];
  var btn=function(s,l){return (u[s+'Id']||u[s+'Blob'])?'<button data-act="dl" data-id="'+esc(u.id)+'" data-side="'+s+'">Scarica '+l+'</button>':''};
  var docs=btn('front','fronte')+btn('back','retro');
  modal('<h3>'+esc(u.n+' '+u.c)+'</h3><dl class="det">'+rows.map(function(r){return '<dt>'+r[0]+'</dt><dd>'+esc(r[1]||'—')+'</dd>'}).join('')+'</dl>'+
   '<div class="idbox"><b>Documento d’identità</b>'+(docs?'<div class="idrow">'+docs+'</div>':'<div class="status">Nessun documento salvato.</div>')+'<div class="status" id="dstat"></div></div>'+
   '<div class="mrow"><button data-act="mclose">Chiudi</button></div>');
}
async function dl(id,side){
  var u=find(id); if(!u)return;
  try{
    var blob=u[side+'Blob']; if(!blob){var r=await fetch('/_blob/'+u[side+'Id']);blob=await r.blob()}
    var name=(u.c+'_'+u.n+'_'+(side==='front'?'fronte':'retro')+'.jpg').replace(/\s+/g,'_');
    if(caps.down){await caps.down.save({filename:name,data:blob})}
    else{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
  }catch(e){ if(e&&e.code==='declined')return; st('dstat','Download non riuscito. Riprova.') }
}
async function doDelete(){
  var ids=Object.keys(sel);
  for(var i=0;i<ids.length;i++){
    var u=find(ids[i]); if(!u)continue;
    if(dbCol){try{await dbCol.doc(String(u.id)).delete()}catch(e){}}
    if(caps.assets){for(var s of ['frontId','backId']){if(u[s]){try{await caps.assets.delete(u[s])}catch(e){}}}}
  }
  if(!dbCol)U=U.filter(function(u){return !sel[u.id]});
  sel={};dm=false;closeModal();listUtenti();
}
document.addEventListener('change',function(e){var t=e.target;if(t.getAttribute&&t.getAttribute('data-side')&&t.files&&t.files[0]){var f=t.files[0];pickFile(t.getAttribute('data-side'),f);t.value=''}});
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]'),r=e.target.closest('[data-row]');
  if(a){var k=a.getAttribute('data-act');
    if(k==='add')addForm();
    else if(k==='mclose')closeModal();
    else if(k==='read')readDoc();
    else if(k==='msave')saveUser();
    else if(k==='dl')dl(a.getAttribute('data-id'),a.getAttribute('data-side'));
    else if(k==='del'){dm=!dm;sel={};listUtenti()}
    else if(k==='cancel'){dm=false;sel={};listUtenti()}
    else if(k==='confirmdel'){var n=Object.keys(sel).length;if(!n)return;modal('<h3>Elimina utenti</h3><p>Vuoi eliminare '+n+(n===1?' utente selezionato':' utenti selezionati')+', compresi i documenti salvati? L’operazione non si può annullare.</p><div class="mrow"><button data-act="mclose">Annulla</button><button class="danger" data-act="dodel">Elimina</button></div>')}
    else if(k==='dodel')doDelete();
    return}
  if(r){var id=r.getAttribute('data-row');if(dm){if(sel[id])delete sel[id];else sel[id]=1;listUtenti()}else openUser(id)}
});
setView(window.innerWidth>=768?'tablet':'mobile');
render();
</script>
